[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genie_evaluator"
version = "0.0.0"
description = "Evaluate a Genie space's benchmark accuracy via the native Eval-Run API, logging results to MLflow and Delta."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
job = [
  "databricks-sdk>=0.117.0",
  "mlflow>=2.15.0",
  "protobuf>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genie_evaluator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
